# /etc/nginx/sites-available/larkmentor
# 由 deploy_lark_mentor.sh step-5b 自动写入并 symlink 到 sites-enabled/
# 对应服务器：118.178.242.26
#
# 路由总览：
#   /              → /var/www/larkmentor/index.html（静态首页）
#   /dashboard     → 127.0.0.1:8001/v3（FastAPI Dashboard 页面）
#   /api/          → 127.0.0.1:8001/api/（FastAPI JSON 接口）
#   /health        → 127.0.0.1:8001/health
#   /static/       → 127.0.0.1:8001/static/（FastAPI 静态资源）
#   /mcp           → 127.0.0.1:8767/（MCP 可视化页）
#   /mcp/          → 127.0.0.1:8767/（MCP 所有路径）
#   /mcp/tools     → 127.0.0.1:8767/tools（JSON 工具列表）
#   /mcp/call      → 127.0.0.1:8767/call（POST 调用接口）
#   /larkmentor_report.pdf → /var/www/larkmentor/ 静态文件

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/larkmentor;
    index index.html;

    # ---------- static homepage ----------
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- /dashboard -> FastAPI 8001/v3 ----------
    location = /dashboard      { proxy_pass http://127.0.0.1:8001/v3; }
    location  /dashboard/      { proxy_pass http://127.0.0.1:8001/; }
    location  /static/         { proxy_pass http://127.0.0.1:8001/static/; }

    # ---------- /api  -> FastAPI 8001 ----------
    location  /api/            {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
    }
    location = /health         { proxy_pass http://127.0.0.1:8001/health; }

    # ---------- /mcp  -> MCP server 8767 ----------
    # 说明：proxy_pass 带尾斜线会 strip location 前缀
    #   /mcp      → 后端收到 GET /   → 返回可视化 HTML
    #   /mcp/tools → 后端收到 GET /tools → 返回 JSON
    #   /mcp/call  → 后端收到 POST /call → 调用工具
    location = /mcp            { proxy_pass http://127.0.0.1:8767/; }
    location = /mcp/           { proxy_pass http://127.0.0.1:8767/; }
    location  /mcp/            { proxy_pass http://127.0.0.1:8767/; }

    # ---------- common proxy headers ----------
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # ---------- gzip ----------
    # 注意：text/html 默认就被 gzip，不需要写进 gzip_types
    # 这意味着 /mcp 返回的 HTML 会被压缩，curl 验证时要加 --compressed
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
